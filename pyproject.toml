[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "procurement-agent"
version = "0.1.0"
description = "Data center procurement workflow automation backend"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.139.2",
  "uvicorn[standard]>=0.35,<1.0",
  "pydantic==2.13.4",
  "pydantic-settings>=2.10,<3.0",
  "SQLAlchemy[asyncio]==2.0.51",
  "asyncmy>=0.2.10,<1.0",
  "alembic==1.18.5",
  "redis>=6.0,<8.0",
  "httpx>=0.28,<1.0",
  "mcp>=1.27,<2.0",
  "langgraph>=1.2,<2.0",
  "FlagEmbedding==1.4.0",
  "torch==2.13.0",
  "huggingface-hub==0.36.2",
  "transformers==4.57.6",
  "qdrant-client==1.18.0",
]

[project.optional-dependencies]
dev = [
  "pytest==8.4.2",
  "pytest-asyncio>=1.0,<2.0",
  "ruff>=0.12,<1.0",
]

[tool.setuptools.packages.find]
include = ["app*", "agent_app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

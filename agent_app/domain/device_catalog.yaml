version: 1

professions:
  "10kV开关柜":
    description: >
      用于10kV等级中压供配电系统，对电路进行接通、分断、
      控制、保护、隔离和测量的开关设备。
    typical_terms:
      - "10kV开关柜"
      - "10KV开关柜"
      - "10kV配电柜"
      - "中压开关柜"
      - "中压柜"
      - "10kV高压柜"
    ambiguous_terms:
      - "高压柜"
      - "开关柜"
      - "配电柜"
      - "环网柜"
    notes: >
      “高压柜”“开关柜”未包含电压等级时存在歧义；
      环网柜属于中压配电设备，但是否统一归入本类别需结合企业采购口径确认。

  "变压器":
    description: >
      用于交流电压等级转换的电力设备。在数据中心供配电场景中，
      常用于把中压电源转换为400V等级低压电源。
    typical_terms:
      - "变压器"
      - "配电变压器"
      - "干式变压器"
      - "干变"
      - "油浸式变压器"
    ambiguous_terms:
      - "箱变"
      - "变电设备"
    notes: >
      箱式变电站通常包含变压器及其他配电设备，
      不宜无条件等同于单独的变压器。

  "400V配电柜":
    description: >
      数据中心低压供配电系统中的配电和控制设备，
      通常包含低压断路器、母排、测量及保护装置等，
      用于400V等级电源的分配、控制和保护。
    typical_terms:
      - "400V配电柜"
      - "400V开关柜"
      - "低压配电柜"
      - "低压开关柜"
      - "低压柜"
      - "低压配电屏"
    ambiguous_terms:
      - "配电柜"
      - "开关柜"
      - "配电屏"
    notes: >
      用户只说“配电柜”时无法确定是10kV还是400V，应结合电压、
      上下文或向用户确认。

  "UPS":
    description: >
      不间断电源系统，用于在正常电源异常或中断时持续为关键IT负载供电，
      通常由整流、逆变、旁路、控制及储能相关部分组成。
    typical_terms:
      - "UPS"
      - "UPS电源"
      - "不间断电源"
      - "不间断电源系统"
      - "模块化UPS"
      - "UPS主机"
      - "UPS模块"
      - "UPS功率模块"
    ambiguous_terms:
      - "功率模块"
      - "电源模块"
      - "热插拔模块"
      - "旁路模块"
      - "整流模块"
    notes: >
      “功率模块”“电源模块”等词不能单独直接映射UPS，
      因为服务器、交换机、防火墙等设备也存在电源模块。
      若上下文出现UPS、模块化UPS、容量kVA等信息，可增强UPS判断。

  "高压直流":
    description: >
      数据中心高压直流供电系统（HVDC），将交流电转换为较高电压等级的
      直流电，为服务器和网络等IT设备提供直流供电。
    typical_terms:
      - "高压直流"
      - "HVDC"
      - "高压直流电源"
      - "高压直流系统"
      - "240V高压直流"
      - "336V高压直流"
      - "380V高压直流"
      - "240V直流系统"
      - "336V直流系统"
      - "380V直流系统"
    ambiguous_terms:
      - "直流电源"
      - "直流系统"
      - "整流模块"
      - "直流模块"
    notes: >
      普通“直流电源”也可能指48V通信电源等其他系统，
      应结合240V/336V/380V、HVDC等信息判断。

  "蓄电池":
    description: >
      用于UPS、高压直流或其他备用供电系统储能的电池及电池组件。
    typical_terms:
      - "蓄电池"
      - "蓄电池组"
      - "电池组"
      - "电池柜"
      - "电池包"
      - "铅酸蓄电池"
      - "铅酸电池"
      - "锂电池"
      - "磷酸铁锂电池"
    ambiguous_terms:
      - "电池"
      - "电池模块"
      - "电池监控"
    notes: >
      “电池柜”可能同时包含电池、开关和监控组件；
      电池监控设备是否归本类别还是“监控”需按采购规则确定。

  "监控":
    description: >
      用于数据中心基础设施集中采集、监视、告警、管理和控制的系统及相关设备，
      可覆盖供配电、制冷、环境、安防等基础设施。
    typical_terms:
      - "机房监控系统"
      - "动力环境监控"
      - "动环监控"
      - "DCIM"
      - "基础设施监控"
      - "监控主机"
      - "监控控制器"
      - "数据采集器"
      - "采集网关"
      - "监控平台"
    ambiguous_terms:
      - "监控"
      - "摄像头"
      - "摄像机"
      - "门禁"
      - "传感器"
      - "监控模块"
    notes: >
      建议本类别偏向“监控平台、控制器、采集和管理设备”。
      温湿度、水浸等环境传感器优先考虑“机房环境”，
      否则会与机房环境类别大量重叠。

  "冷水机组":
    description: >
      制冷系统中产生冷冻水的核心制冷设备，
      冷冻水通过水系统输送至数据中心末端制冷设备进行换热。
    typical_terms:
      - "冷水机组"
      - "冷机"
      - "Chiller"
      - "水冷冷水机组"
      - "风冷冷水机组"
      - "离心式冷水机组"
      - "离心冷机"
      - "螺杆式冷水机组"
      - "螺杆冷机"
      - "磁悬浮冷水机组"
    ambiguous_terms:
      - "制冷机"
      - "制冷主机"
    notes: >
      冷水机组与列间空调、精密空调属于不同层级：
      前者产生冷冻水，后者通常属于机房侧制冷末端。

  "SHU":
    description: >
      当前按数据中心氟泵分体式空调设备理解，
      通过室内外分体结构和氟泵自然冷却等方式为数据中心提供制冷。
    typical_terms:
      - "SHU"
      - "SHU空调"
      - "氟泵SHU"
      - "氟泵分体空调"
      - "分体式氟泵空调"
    ambiguous_terms:
      - "氟泵空调"
      - "精密空调"
      - "机房空调"
      - "分体空调"
    notes: >
      SHU不是一个足够通用的行业统一类别名称。
      当前公开资料中可检索到腾讯数据中心将SHU用于“氟泵分体空调”的叫法，
      必须结合你们原始采购数据确认公司内部的SHU是否也是这个含义。

  "冷却塔":
    description: >
      水冷制冷系统中的散热设备，将冷凝水系统携带的热量排向室外环境，
      常通过蒸发换热完成散热。
    typical_terms:
      - "冷却塔"
      - "凉水塔"
      - "冷却水塔"
    ambiguous_terms:
      - "水塔"
      - "散热塔"
    notes: >
      普通“水塔”不能直接判断为数据中心冷却塔。

  "冷却泵":
    description: >
      制冷水系统中用于驱动水循环的泵类设备。
      根据具体回路可能包括冷却水泵或冷冻水泵。
    typical_terms:
      - "冷却水泵"
      - "冷却泵"
      - "冷冻水泵"
      - "冷冻泵"
      - "循环水泵"
      - "冷水泵"
    ambiguous_terms:
      - "水泵"
      - "循环泵"
      - "泵组"
    notes: >
      工程上冷却水泵和冷冻水泵属于不同水回路。
      你们17类只有“冷却泵”一类，因此必须确认公司是否把两者统一归入该类别。

  "机房环境":
    description: >
      用于检测或保障数据中心机房环境状态的传感、检测及环境辅助设备，
      重点关注温度、湿度、漏水、烟雾等环境状态。
    typical_terms:
      - "温度传感器"
      - "湿度传感器"
      - "温湿度传感器"
      - "环境传感器"
      - "水浸传感器"
      - "漏水传感器"
      - "漏水检测"
      - "水浸检测"
      - "烟感"
      - "烟雾传感器"
    ambiguous_terms:
      - "传感器"
      - "探测器"
      - "环境监控"
      - "门磁"
    notes: >
      建议将“环境传感设备”和“监控平台/采集控制设备”分开：
      前者归机房环境，后者归监控。

  "水系统":
    description: >
      数据中心冷冻水、冷却水等水力系统中的管网和辅助设备。
      在本项目分类中，冷水机组、冷却塔和冷却泵已单独成类，
      因此本类别主要承接其余水系统组件。
    typical_terms:
      - "水系统"
      - "冷冻水系统"
      - "冷却水系统"
      - "水处理系统"
      - "水处理设备"
      - "水管"
      - "管路"
      - "阀门"
      - "电动阀"
      - "蝶阀"
      - "止回阀"
      - "过滤器"
      - "板式换热器"
      - "板换"
      - "补水装置"
      - "定压补水装置"
      - "膨胀罐"
      - "蓄冷罐"
      - "加药装置"
    ambiguous_terms:
      - "水泵"
      - "循环泵"
      - "换热设备"
    notes: >
      水泵优先按“冷却泵”处理；
      水系统主要承担管网、阀门、水处理、换热及辅助设备。

  "传输":
    description: >
      用于数据中心网络连接、数据转发和通信传输的网络设备及相关组件。
    typical_terms:
      - "交换机"
      - "核心交换机"
      - "汇聚交换机"
      - "接入交换机"
      - "数据中心交换机"
      - "路由器"
      - "光模块"
      - "光纤模块"
      - "网络设备"
      - "传输设备"
    ambiguous_terms:
      - "防火墙"
      - "网关"
      - "通信设备"
      - "网络模块"
      - "电源模块"
    notes: >
      “防火墙”从行业功能上属于网络安全设备，
      如果你们内部17类没有安全设备类别，可以按企业现有规则归入“传输”，
      但应该明确这是公司分类规则。

  "服务器":
    description: >
      为数据中心计算业务提供CPU、内存、GPU等计算资源的服务器硬件设备。
    typical_terms:
      - "服务器"
      - "服务器主机"
      - "机架服务器"
      - "机架式服务器"
      - "刀片服务器"
      - "计算服务器"
      - "GPU服务器"
      - "AI服务器"
      - "训练服务器"
      - "推理服务器"
      - "高性能计算服务器"
    ambiguous_terms:
      - "计算节点"
      - "节点服务器"
      - "主机"
      - "计算设备"
      - "存储服务器"
    notes: >
      “主机”“计算设备”范围过大，不能单独确定；
      存储设备是否归服务器需按企业现有数据口径确认。

  "运维工具":
    description: >
      用于数据中心日常巡检、检测、故障定位、安装和维修的工具、
      仪器仪表及辅助用品。
    typical_terms:
      - "万用表"
      - "数字万用表"
      - "钳形电流表"
      - "钳形表"
      - "红外热像仪"
      - "测温仪"
      - "绝缘电阻测试仪"
      - "兆欧表"
      - "网络测试仪"
      - "网线测试仪"
      - "光功率计"
      - "光纤测试仪"
      - "标签机"
      - "工具箱"
      - "维修工具"
      - "巡检工具"
    ambiguous_terms:
      - "测试仪"
      - "检测仪"
      - "工具"
      - "仪表"
    notes: >
      该类别属于企业采购管理分类，不是单一工程设备类别，
      应避免仅凭“仪表”“测试仪”等泛称自动判断。

  "列间空调":
    description: >
      安装在服务器机柜行列之间或行端附近的近端制冷设备，
      通过靠近IT负载的方式进行行级或列级精确制冷。
    typical_terms:
      - "列间空调"
      - "行间空调"
      - "行级空调"
      - "InRow空调"
      - "InRow"
      - "列间制冷"
      - "行级制冷"
      - "机柜列间空调"
    ambiguous_terms:
      - "精密空调"
      - "机房空调"
      - "空调"
    notes: >
      “精密空调”是更大的概念，可能是房间级、列间级或其他形式，
      不应看到“精密空调”就直接映射到列间空调。
